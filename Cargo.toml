[workspace]
resolver = "3"
members = [
    "crates/camlet",
    "crates/camlet-camera",
    "crates/camlet-core",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Camlet contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/rayan6ms/camlet"
readme = "README.md"
keywords = ["camera", "desktop", "iced", "overlay", "webcam"]
categories = ["gui", "multimedia::video"]

[workspace.dependencies]
atomic-write-file = "0.3.0"
bytemuck = { version = "1.24.0", features = ["derive"] }
directories = "6.0.0"
iced = { version = "0.14.0", default-features = false, features = [
    "image-without-codecs",
    "thread-pool",
    "wayland",
    "wgpu",
    "x11",
] }
num-traits = "0.2.19"
nokhwa = { version = "0.10.11", default-features = false, features = ["decoding", "input-native"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sys-locale = "0.3.2"
thiserror = "2.0.16"
webbrowser = { version = "1.2.4", default-features = false, features = ["hardened"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = "line-tables-only"
