id: io.github.rayan6ms.camlet
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm21
command: camlet
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=all
  - --env=WINIT_UNIX_BACKEND=x11
modules:
  - name: camlet
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
      env:
        CARGO_HOME: /run/build/camlet/cargo
        CARGO_NET_OFFLINE: "true"
        LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    build-commands:
      - install -Dm0644 packaging/flatpak/cargo-config.toml .cargo/config.toml
      - cargo build --offline --release --locked -p camlet
      - install -Dm0755 target/release/camlet /app/bin/camlet
      - install -Dm0644 packaging/linux/io.github.rayan6ms.camlet.desktop /app/share/applications/io.github.rayan6ms.camlet.desktop
      - install -Dm0644 packaging/linux/io.github.rayan6ms.camlet.metainfo.xml /app/share/metainfo/io.github.rayan6ms.camlet.metainfo.xml
      - install -Dm0644 assets/camlet-rust.svg /app/share/icons/hicolor/scalable/apps/io.github.rayan6ms.camlet.svg
      - install -Dm0644 assets/icons/256x256.png /app/share/icons/hicolor/256x256/apps/io.github.rayan6ms.camlet.png
      - install -Dm0644 LICENSE /app/share/licenses/io.github.rayan6ms.camlet/LICENSE
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - benchmarks/raw
          - packaging/flatpak/vendor
      - type: dir
        path: vendor
        dest: vendor
