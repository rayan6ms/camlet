name = "camlet"
product-name = "Camlet"
version = "0.2.3"
identifier = "io.github.rayan6ms.camlet"
out-dir = "target/packages"
binaries-dir = "target/release"
description = "Lightweight floating camera overlay"
long-description = "Camlet is a lightweight, always-on-top camera overlay for presentations, recordings, and calls."
homepage = "https://github.com/rayan6ms/camlet"
authors = ["Camlet contributors"]
publisher = "Camlet contributors"
license-file = "LICENSE"
category = "Utility"
# Generated from assets/camlet-rust.svg by scripts/generate-icons.sh.
icons = [
	"assets/icon.ico",
	"assets/icons/32x32.png",
	"assets/icons/128x128.png",
	"assets/icons/256x256.png",
	"assets/icons/512x512.png",
]

[[binaries]]
path = "camlet"
main = true

[deb]
desktop-template = "packaging/linux/camlet-packager.desktop.hbs"

[deb.files]
"LICENSE" = "usr/share/doc/camlet/copyright"
"packaging/linux/camlet.1" = "usr/share/man/man1/camlet.1"
"packaging/linux/io.github.rayan6ms.camlet.metainfo.xml" = "usr/share/metainfo/io.github.rayan6ms.camlet.metainfo.xml"
"assets/camlet-rust.svg" = "usr/share/icons/hicolor/scalable/apps/camlet.svg"

[appimage.files]
"packaging/linux/io.github.rayan6ms.camlet.metainfo.xml" = "usr/share/metainfo/io.github.rayan6ms.camlet.metainfo.xml"
"assets/camlet-rust.svg" = "usr/share/icons/hicolor/scalable/apps/camlet.svg"

[nsis]
compression = "lzma"
installer-mode = "currentUser"
languages = ["English", "PortugueseBR"]
installer-icon = "assets/icon.ico"
