name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev mesa-vulkan-drivers xvfb
      - uses: Swatinem/rust-cache@v2
      - name: Install package tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build and test packages
        run: |
          cargo build --workspace --release --locked
          cargo packager --config Packager.toml --formats appimage,deb
          appimage="$(find target/packages -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find target/packages -maxdepth 1 -name '*.deb' -print -quit)"
          scripts/test-linux-packages.sh "$appimage" "$deb" "$RUNNER_TEMP/camlet-release-linux"
          version="${GITHUB_REF_NAME#v}"
          mv "$appimage" "target/packages/camlet-rust_${version}_x86_64.AppImage"
          mv "$deb" "target/packages/camlet-rust_${version}_amd64.deb"
          (cd target/packages && sha256sum camlet-rust_*.AppImage camlet-rust_*.deb > SHA256SUMS-linux.txt)
          (cd target/packages && sha256sum --check SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            target/packages/*.AppImage
            target/packages/*.deb
            target/packages/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install package tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build and test package
        shell: pwsh
        run: |
          cargo build --workspace --release --locked
          cargo packager --config Packager.toml --formats nsis
          $installer = Get-ChildItem target/packages -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not generated" }
          scripts/test-windows-package.ps1 -Installer $installer.FullName -OutputDirectory "$env:RUNNER_TEMP/camlet-release-windows"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $renamed = Join-Path $installer.DirectoryName "camlet-rust_${version}_x64-setup.exe"
          Move-Item $installer.FullName $renamed
          Get-FileHash $renamed -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content target/packages/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            target/packages/*.exe
            target/packages/SHA256SUMS-windows.txt
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust and RPM build dependencies
        run: |
          dnf install --assumeyes rust cargo clang clang-devel gcc gcc-c++ libxkbcommon-devel wayland-devel libX11-devel libXcursor-devel libXi-devel libXrandr-devel mesa-libGL-devel rpm-build rpmdevtools rpmlint desktop-file-utils appstream
      - name: Build and validate RPM
        run: |
          cargo build --workspace --release --locked
          scripts/build-rpm.sh
          rpm="$(find target/packages -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$rpm"
          rpmlint "$rpm" packaging/rpm/camlet.spec
          rpm -K "$rpm"
          rpm -qpl "$rpm"
          (cd target/packages && sha256sum -- *.rpm > SHA256SUMS-rpm.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-rpm
          path: |
            target/packages/*.rpm
            target/packages/SHA256SUMS-rpm.txt
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm21//25.08
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Build, install, run, and uninstall Flatpak
        env:
          CAMLET_TEST_FLATPAK: "1"
        run: scripts/build-flatpak.sh
      - name: Create Flatpak checksum
        run: (cd target/packages && sha256sum -- *.flatpak > SHA256SUMS-flatpak.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          path: |
            target/packages/*.flatpak
            target/packages/SHA256SUMS-flatpak.txt
          if-no-files-found: error

  publish:
    needs: [linux, windows, rpm, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download verified packages
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --notes-from-tag --target "$GITHUB_SHA" --title "Camlet $GITHUB_REF_NAME"
